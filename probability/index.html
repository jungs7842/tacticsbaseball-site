<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#05070b">
<title>확률정보 | 작전야구매니저</title>
<style>
:root{--bg:#05070b;--panel:#0b1018;--panel2:#0f1622;--line:rgba(255,255,255,.12);--muted:#aeb8c7;--shell:min(1180px,calc(100% - 28px));}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}body{word-break:keep-all}
.shell{width:var(--shell);margin:0 auto}.head{position:sticky;top:0;z-index:20;background:rgba(5,7,11,.94);border-bottom:1px solid var(--line);padding:18px 0}
.brand{font-weight:800}.hero{padding:42px 0 22px}.hero h1{font-size:clamp(32px,6vw,54px);margin:0 0 10px}.hero p{color:var(--muted);line-height:1.7;margin:0}.updated{font-size:12px;color:#7f8a9a;margin-top:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,.content-btn,.page-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:10px;cursor:pointer}
.tab{padding:10px 16px;font-weight:700}.tab.active{background:#fff;color:#080b10}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;padding-bottom:60px}
.content-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;height:max-content;position:sticky;top:86px}.content-btn{display:block;width:100%;padding:12px;text-align:left;border:0;background:transparent}.content-btn.active{background:#162441}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}.card-head{padding:18px;border-bottom:1px solid var(--line)}.card-head h2,.card-head h3{margin:0}.card-head p{color:var(--muted);font-size:12px;margin:7px 0 0}
.table-wrap{overflow:auto}table{width:100%;min-width:680px;border-collapse:collapse;font-size:12px}th,td{padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}th{background:#152033;position:sticky;top:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:var(--panel2);border-bottom:1px solid var(--line)}.search,.select{background:#070b11;border:1px solid var(--line);color:#fff;border-radius:8px;min-height:38px;padding:0 10px}.search{flex:1 1 220px}
.pager{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;color:var(--muted);font-size:12px}.page-btn{padding:8px 11px}.notice{padding:13px 15px;margin-bottom:16px;border:1px solid rgba(77,126,255,.28);background:rgba(19,62,255,.12);border-radius:10px;color:#cad7ff}.loading{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:840px){.layout{grid-template-columns:1fr}.content-list{position:static;display:flex;overflow:auto}.content-btn{width:auto;white-space:nowrap}.hero{padding-top:30px}}
</style>
</head>
<body>
<header class="head"><div class="shell brand">KBO 작전야구매니저</div></header>
<main class="shell"><section class="hero"><h1>확률정보</h1><p>드래프트, 스카우트, 선수조합 및 아이템 확률정보</p><div class="updated" id="updateText"></div></section>
<nav class="tabs" id="categoryTabs"></nav><div class="layout"><aside class="content-list" id="contentList"></aside><section id="contentArea"><div class="loading">Loading...</div></section></div></main>
<script>
const state={manifest:null,category:null,current:null,data:null,page:1,pageSize:100,search:'',filters:{}};
const el={tabs:document.getElementById('categoryTabs'),list:document.getElementById('contentList'),area:document.getElementById('contentArea'),update:document.getElementById('updateText')};
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
const isProb=h=>String(h).includes('획득확률');
function fmt(v,h){if(isProb(h)&&typeof v==='number'){let p=(v*100).toFixed(6).replace(/0+$/,'').replace(/\.$/,'');return p+'%';}if(h==='등급'&&v!=='')return esc(v)+'성';return esc(v);}
function table(b){if(!b||!b.headers)return '';return '<div class="table-wrap"><table><thead><tr>'+b.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+b.headers.map((h,i)=>'<td>'+fmt(r[i],h)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function rows(){const d=state.data.detail,q=state.search.trim().toLowerCase();return d.rows.filter(r=>{if(q&&!r.some(v=>String(v??'').toLowerCase().includes(q)))return false;for(const [i,v] of Object.entries(state.filters)){if(v&&String(r[+i]??'')!==v)return false;}return true;});}
function filters(){const d=state.data.detail,p=['옵션','회차','슬롯','기준구단','구분'];return p.map(n=>{let i=d.headers.indexOf(n);if(i<0)return null;let v=[...new Set(d.rows.map(r=>String(r[i]??'')).filter(Boolean))];return v.length>1&&v.length<=50?{i,n,v}:null;}).filter(Boolean);}
function detail(){let d=state.data.detail,rr=rows(),pages=Math.max(1,Math.ceil(rr.length/state.pageSize));
state.page=Math.min(state.page,pages);let st=(state.page-1)*state.pageSize;
let block={headers:d.headers,rows:rr.slice(st,st+state.pageSize)};
let fs=filters().map(f=>'<select class="select df" data-i="'+f.i+'"><option value="">'+esc(f.n)+' 전체</option>'+
f.v.map(v=>'<option value="'+esc(v)+'" '+((state.filters[f.i]||'')===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>').join('');
return '<div class="card"><div class="card-head"><h3>선수별 상세 확률정보</h3></div>'+
'<div class="controls"><input class="search" id="q" value="'+esc(state.search)+'" placeholder="선수명, 팀, 포지 검색">'+fs+
'<select class="select" id="ps">'+[50,100,200,500].map(n=>'<option '+(state.pageSize===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div>'+
table(block)+'<div class="pager"><span>'+rr.length.toLocaleString()+'개</span><span><button class="page-btn" id="prev">이전</button> '+state.page+' / '+pages+
' <button class="page-btn" id="next">다음</button></span></div></div>';}
function wire(){let q=document.getElementById('q');if(q)q.oninput=e=>{state.search=e.target.value;state.page=1;refresh();};document.querySelectorAll('.df').forEach(x=>x.onchange=e=>{state.filters[e.target.dataset.i]=e.target.value;state.page=1;refresh();});let ps=document.getElementById('ps');if(ps)ps.onchange=e=>{state.pageSize=+e.target.value;state.page=1;refresh();};let p=document.getElementById('prev'),n=document.getElementById('next');if(p)p.onclick=()=>{if(state.page>1){state.page--;refresh();}};if(n)n.onclick=()=>{state.page++;refresh();};}
function refresh(){let h=document.getElementById('detailHolder');if(h){h.innerHTML=detail();wire();}}
function render(){let d=state.data,sum=d.summary?'<div class="card"><div class="card-head"><h3>요약</h3></div>'+table(d.summary)+'</div>':'';el.area.innerHTML='<div class="notice">표시되 확률정보는 현재 적용 데이터 기준입니다.</div><div class="card"><div class="card-head"><h2>'+esc(d.name)+'</h2></div></div>'+sum+'<div id="detailHolder">'+detail()+'</div>';wire();}
async function load(i){state.current=i;state.page=1;state.search='';state.filters={};document.querySelectorAll('.content-btn').forEach(b=>b.classList.toggle('active',b.dataset.name===i.name));el.area.innerHTML='<div class="loading">Loading...</div>';let r=await fetch(i.file,{cache:'no-store'});state.data=await r.json();render();}
function list(){let a=state.manifest.contents.filter(x=>x.category===state.category);el.list.innerHTML=a.map(x=>'<button class="content-btn" data-name="'+esc(x.name)+'">'+esc(x.name)+'</button>').join('');el.list.querySelectorAll('.content-btn').forEach(b=>b.onclick=()=>load(a.find(x=>x.name===b.dataset.name)));if(a.length)load(a[0]);}
function tabs(){el.tabs.innerHTML=state.manifest.categories.map(c=>'<button class="tab '+(state.category===c?'active':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');el.tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.category=b.dataset.c;tabs();list();});}
async function init(){try{let r=await fetch('data/manifest.json',{cache:'no-store'});state.manifest=await r.json();el.update.textContent='최종 업데이트: '+state.manifest.updatedAt;state.category=state.manifest.categories[0];tabs();list();}catch(e){el.area.innerHTML='<div class="notice">확률정보 불러오기 실패했습습다.</div>';console.error(e);}}
init();
</script></body></html>
